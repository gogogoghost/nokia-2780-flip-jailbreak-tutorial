[package]
name = "screencapture-daemon"
version = "0.1.0"
edition = "2018"
license = "Apache-2.0"
description = "Child daemon exposing the screencapture remote service"

# NOTE: this crate is built inside the api-daemon source tree as
# `child-screencapture-daemon/`, which is why the paths below point there.
# See ../build.sh.

[dependencies]
bincode = "1.3"
common = { path = "../common" }
futures = "0.3"
screencapture_service = { path = "../services/Screencapture" }
log = "0.4"
nix = "0.19"
parking_lot = "0.11"

[target.'cfg(not(target_os = "android"))'.dependencies]
env_logger = "0.8"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.5"
