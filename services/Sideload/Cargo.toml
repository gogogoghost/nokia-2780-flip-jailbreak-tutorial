[package]
name = "sideload_service"
version = "0.1.0"
edition = "2018"
license = "Apache-2.0"
description = "Sideload: permission gated app management service for KaiOS"

# NOTE: this crate is built inside the api-daemon source tree
# (services/Sideload), which is why the common/codegen paths point there.
# See ../build.sh.

[dependencies]
common = { path = "../../common" }
flate2 = "1.0"
log = "0.4"
parking_lot = "0.11"
reqwest = { version = "0.11", default-features = false, features = ["blocking"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[build-dependencies]
common = { path = "../../common" }
